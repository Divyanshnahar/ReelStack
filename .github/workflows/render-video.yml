name: Render Video

on:
  workflow_dispatch:
    inputs:
      videoId:
        description: 'The ID of the video to render'
        required: true
        type: string
      width:
        description: 'Video width'
        required: false
        default: '1080'
        type: string
      height:
        description: 'Video height'
        required: false
        default: '1920'
        type: string
      fps:
        description: 'Frames per second'
        required: false
        default: '30'
        type: string
      duration:
        description: 'Video duration in seconds'
        required: false
        default: '30'
        type: string

jobs:
  render:
    name: Render Video
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Fetch Video Data
        run: node scripts/fetch-video-data.js "${{ inputs.videoId }}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_DATABASE_URL: ${{ secrets.NEXT_PUBLIC_DATABASE_URL }}
          API_URL: ${{ secrets.API_URL }}

      - name: Render Video
        run: |
          mkdir -p out
          npx remotion render remotion/index.ts ReelsStackRenderedVideo "out/rendered-video-${{ inputs.videoId }}.mp4" --props="./video-data.json"

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video-${{ inputs.videoId }}
          path: out/rendered-video-${{ inputs.videoId }}.mp4
          retention-days: 7
